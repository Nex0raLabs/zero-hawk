[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-hawk"
version = "0.2.0"
description = "Zero Hawk — local-first business prospecting and outreach workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.9,<1", "dnspython>=2.6,<3"]

[project.optional-dependencies]
ai = ["httpx>=0.27,<1"]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
zero-hawk = "openprospect.cli:main"
openprospect = "openprospect.cli:main"

[tool.setuptools.packages.find]
include = ["openprospect*"]
